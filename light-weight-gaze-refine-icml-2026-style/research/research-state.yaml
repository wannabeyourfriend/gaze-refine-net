framing:
  path: C
  title_working: "Anchored Spatial Shrinkage for Few-Shot Per-Trial Calibration"
  story: >
    Per-trial bias is the dominant source of residual error after classical
    eye-tracking calibration. Estimating it from K extra fixations is noisy
    at small K. We derive the Bayes-optimal scalar shrinkage in the
    Gaussian-bias model and show it outperforms the empirical mean. We then
    extend to a position-dependent shrinkage field lambda(p) parameterised
    by sinusoidal features, learned amortised over many trials. The result:
    a 17% reduction in test L2 over the strongest classical anchor at K=12
    on the self-collected dataset, with a closed-form lower bound matched
    in the synthetic homoscedastic regime.
  contributions:
    - 1. Theoretical: Bayes-optimal scalar shrinkage for per-trial Gaussian
         bias is derived in closed form; we show the result is invariant to
         the spatial structure of the anchor.
    - 2. Methodological: spatial shrinkage λ(p) — a position-dependent
         generalisation of scalar shrinkage that captures heteroscedastic
         per-screen-region reliability.
    - 3. Algorithmic: amortised inference of λ via a small MLP conditioned
         on per-trial sample statistics (mean magnitude, variance, K).
    - 4. Empirical: a synthetic benchmark validating the theory; LOSO
         results on a 12-subject self-collected dataset and JuDo1000.

