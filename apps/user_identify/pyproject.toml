[project]
name = "user-identify"
version = "0.1.0"
description = "User identification from gaze patterns using neural networks"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.uv]
dev-dependencies = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
