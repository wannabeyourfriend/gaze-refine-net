model:
  type: "cascade"
  input_dim: 4
  hidden_dims: [256]
  dropout: 0.1
  coordinate_scale: 100.0


training:
  batch_size: 128
  num_epochs: 200
  learning_rate: 0.0003
  optimizer: "adamw"
  weight_decay: 0.001
  scheduler: "cosine"
  grad_clip: 1.0
  checkpoint_interval: 100
  checkpoint_dir: "../../checkpoints/cascade_sim_rbf/"

loss:
  mse_weight: 1.0
  euclidean_weight: 1.0
  regularization_weight: 0.001

data:
  train_data_path: "../../data/prepared/split_avg_data/train.csv"
  val_data_path: "../../data/prepared/split_avg_data/val.csv"
  test_data_path: "../../data/prepared/split_avg_data/test.csv"
  num_workers: 2
  normalize: true
  augmentation: false

experiment:
  name: "calibration-neural-refine"
  seed: 1047
  use_wandb: true
  wandb_project: "calibration-neural-refine"
  wandb_entity: null
  device: "cpu"

evaluation:
  save_predictions: true
  visualize: false
  output_dir: "../../outputs"
